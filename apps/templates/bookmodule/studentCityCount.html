<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students per City</title>
</head>
<body>
  <h1>Number of Students in Each City</h1>
  <ul>
    {% for city in cities %}
      <li>{{ city.city }}: {{ city.student_count }} student(s)</li>
    {% empty %}
      <li>No cities or students found in the database.</li>
    {% endfor %}
  </ul>
</body>
</html>
