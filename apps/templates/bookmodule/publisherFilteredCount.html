<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publisher Filtered Book Count</title>
</head>
<body>
  <h1>Publishers - Count of Filtered Books</h1>
  <p>Only books with price &gt; 50 and 1 &le; quantity &lt; 5</p>
  <table border="1" cellpadding="8">
    <tr>
      <th>Publisher Name</th>
      <th>Location</th>
      <th>Number of Books</th>
    </tr>
    {% for publisher in publishers %}
      <tr>
        <td>{{ publisher.name }}</td>
        <td>{{ publisher.location }}</td>
        <td>{{ publisher.book_count }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No publishers found in the database.</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
