<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Cards</title>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
    th { background-color: #f2f2f2; }
    .btn-add { background-color: #4CAF50; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; }
    .photo { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Student Cards (with Photos)</h1>

  <p>
    <a href="{% url 'card_add' %}" class="btn-add">Add New Card</a>
  </p>

  <table>
    <tr>
      <th>ID</th>
      <th>Photo</th>
      <th>Name</th>
      <th>University ID</th>
      <th>Actions</th>
    </tr>
    {% for card in cards %}
      <tr>
        <td>{{ card.id }}</td>
        <td>
          {% if card.photo %}
            <img src="{{ card.photo.url }}" alt="{{ card.name }}" class="photo">
          {% else %}
            No photo
          {% endif %}
        </td>
        <td>{{ card.name }}</td>
        <td>{{ card.university_id }}</td>
        <td>
          <a href="{% url 'card_edit' card.id %}">Edit</a> |
          <a href="{% url 'card_delete' card.id %}" style="color: red;" onclick="return confirm('Are you sure you want to delete this card?');">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="5">No student cards found.</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
