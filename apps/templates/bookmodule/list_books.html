<!DOCTYPE html>
<html lang="en">
{% load static %} <!-- load static -->
<head>
  <title>List of Books</title>
  <meta name="keywords" content="Books, recent, Learning, library">
  <meta name="description" content="Books website">
  <meta name="author" content="author name">
  <meta charset="UTF-8">
  <link rel="icon" href="{% static 'qu-icon.png' %}"> <!-- static template tag -->
  <link rel="stylesheet" href="{% static 'styles.css' %}"> <!-- static template tag -->
  <style> /* add internal css */
    h1 { color: green; }
    h2 { color: lightskyblue; }
    p { font-family: verdana; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <div class="topnav">
    <a href="{% url 'books.index' %}">Home</a> <!-- URL template tag -->
    <a class="active" href="{% url 'lab10_part1_list' %}">List Books</a> <!-- URL template tag -->
    <a href="{% url 'books.aboutus' %}">About</a> <!-- URL template tag -->
  </div>

  <h1>List of Books</h1>

  <p> <!-- Link to add a new book (Task 2) -->
    <a href="{% url 'lab10_part1_add' %}" class="btn-add">Add New Book</a>
  </p>

  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Actions</th>
    </tr>
    {% for book in books %}
      <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>${{ book.price }}</td>
        <td>{{ book.quantity }}</td>
        <td> <!-- Edit and Delete buttons carrying the book's ID (Tasks 3 & 4) -->
          <a href="{% url 'lab10_part1_edit' book.id %}" class="btn-edit">Edit</a> |
          <a href="{% url 'lab10_part1_delete' book.id %}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this book?');">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="5">No books found in the database.</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
