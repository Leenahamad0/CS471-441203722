<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Student Card</title>
</head>
<body>
  <h1>Edit Student Card</h1>

  {% if card.photo %}
    <p>Current photo:</p>
    <img src="{{ card.photo.url }}" alt="{{ card.name }}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 6px;">
  {% endif %}

  <!-- enctype is required so the browser sends the image file -->
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update Card</button>
  </form>
  <br>
  <a href="{% url 'card_list' %}">Back to List</a>
</body>
</html>
