<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Student Card</title>
</head>
<body>
  <h1>Add New Student Card</h1>
  <!-- enctype is required so the browser sends the image file -->
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Card</button>
  </form>
  <br>
  <a href="{% url 'card_list' %}">Back to List</a>
</body>
</html>
